  <!-- CONTENT -->

    <div class="section-title">Edit Pesan</div>

    <textarea id="edit-area" class="edit-area">Assalamualaikum Wr. Wb.

Perkenalkan, saya Aulia Ramadhani, mahasiswa Teknik Komputer Universitas Negeri Makassar dengan NIM 250210500009.

    <!-- Action Bar -->
    <div class="action-bar">
      <button class="btn btn-outline" onclick="resetText()">🔄 Reset</button>
      <button class="btn btn-primary" onclick="saveAndGoBack()">Simpan Perubahan</button>
    </div>

  </div>

  <div class="toast" id="toast"></div>
  <script src="utils.js"></script>
  <script>
    const originalText = document.getElementById('edit-area').value;

    function resetText() {
      document.getElementById('edit-area').value = originalText;
      showToast('🔄 Teks dikembalikan ke semula');
    }

    function saveAndGoBack() {
      showToast('✅ Perubahan disimpan!');
      setTimeout(() => { window.location.href = 'page4-hasil.html'; }, 1200);
    }
  </script>
